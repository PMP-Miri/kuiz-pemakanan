<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NutriArena POP 3.0 | Semakan kod</title><style>body{font:17px system-ui,sans-serif;max-width:1000px;margin:36px auto;padding:20px;color:#292344;background:#f8f5ff}h1{font-size:32px}pre{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;padding:24px;border-radius:20px;background:white;border:1px solid #dfd2f0}#summary{font-size:26px;font-weight:900;color:#08765e}a{color:#6941d9}</style></head><body><h1>Semakan kod POP 3.0</h1><p>309 semakan model dan reka bentuk. Tiada panggilan Supabase atau perubahan data. Ini bukan ujian sambungan live atau kebolehbacaan pada TV.</p><p id="summary">Sedang menyemak…</p><pre id="results"></pre><p><a href="../pratonton.html">Buka pratonton visual</a> · <a href="../pegawai.html">Studio Pegawai</a></p><script type="module">import {runActivityChecks} from './activities-v2.js?v=pop3';import {runDesignChecks} from './design-pop.js?v=pop3';try{const old=runActivityChecks(),design=runDesignChecks();const result={total:old.total+design.total,passed:old.passed+design.passed,failed:[...old.failed,...design.failed],model:old.passed,design:design.passed};document.querySelector('#summary').textContent=`${result.passed}/${result.total} semakan lulus`;document.querySelector('#results').textContent=JSON.stringify(result,null,2);}catch(err){document.querySelector('#summary').textContent='Semakan tidak dapat dimulakan';document.querySelector('#results').textContent=err.stack||err.message;}</script></body></html>
